[supervisord]
nodaemon=true
logfile=/app/storage/logs/capacity-supervisor.log
pidfile=/run/capacity-supervisor.pid
user=root
[unix_http_server]
file=/run/capacity-supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/capacity-supervisor.sock
[program:mysql]
command=/usr/sbin/mysqld --defaults-file=/app/benchmark/mysql.cnf
priority=1
autorestart=true
stdout_logfile=/app/storage/logs/capacity-mysql-stdout.log
stderr_logfile=/app/storage/logs/capacity-mysql-stderr.log
[program:fpm]
command=/usr/sbin/php-fpm8.5 -F -y /app/benchmark/php-fpm.conf
priority=5
autorestart=true
stdout_logfile=/app/storage/logs/capacity-fpm-stdout.log
stderr_logfile=/app/storage/logs/capacity-fpm-stderr.log
[program:nginx]
command=/usr/sbin/nginx -c /app/benchmark/nginx.conf -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/app/storage/logs/capacity-nginx-stdout.log
stderr_logfile=/app/storage/logs/capacity-nginx-stderr.log
[program:pdf-recovery]
command=/bin/bash /app/benchmark/wait-db.sh /usr/bin/php -d memory_limit=256M artisan proposal-pdfs:recover --watch --no-interaction
directory=/app
user=www-data
environment=HOME="/var/www"
priority=15
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/app/storage/logs/capacity-recovery.log
stderr_logfile=/app/storage/logs/capacity-recovery-error.log
[program:pdf-queue]
command=/bin/bash /app/benchmark/wait-db.sh /usr/bin/php -d memory_limit=256M artisan queue:work proposal-pdfs --sleep=1 --tries=3 --timeout=540 --memory=192 --no-interaction
directory=/app
user=www-data
environment=HOME="/var/www"
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/app/storage/logs/capacity-pdf-queue.log
stderr_logfile=/app/storage/logs/capacity-pdf-queue-error.log
[program:default-queue]
command=/bin/bash /app/benchmark/wait-db.sh /usr/bin/php -d memory_limit=256M artisan queue:work --queue=default,research-manual-checks,literature-harvest --sleep=1 --tries=1 --timeout=180 --memory=192 --no-interaction
directory=/app
user=www-data
environment=HOME="/var/www"
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/app/storage/logs/capacity-default-queue.log
stderr_logfile=/app/storage/logs/capacity-default-queue-error.log
[program:reverb]
command=/usr/bin/php -d memory_limit=256M artisan reverb:start --no-interaction
directory=/app
user=www-data
priority=20
autorestart=true
stdout_logfile=/app/storage/logs/capacity-reverb.log
stderr_logfile=/app/storage/logs/capacity-reverb-error.log
[program:scheduler]
command=/usr/bin/php -d memory_limit=256M artisan schedule:work --no-interaction
directory=/app
user=www-data
priority=25
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/app/storage/logs/capacity-scheduler.log
stderr_logfile=/app/storage/logs/capacity-scheduler-error.log
