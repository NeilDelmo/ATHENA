[global]
daemonize=no
error_log=/app/storage/logs/capacity-fpm.log
[www]
user=www-data
group=www-data
listen=127.0.0.1:9000
pm=static
pm.max_children=4
pm.max_requests=300
clear_env=no
catch_workers_output=yes
request_terminate_timeout=600
php_admin_value[memory_limit]=256M
php_admin_value[max_execution_time]=540
php_admin_value[upload_max_filesize]=25M
php_admin_value[post_max_size]=64M
php_admin_value[log_errors]=On
php_admin_value[error_log]=/app/storage/logs/capacity-php.log
